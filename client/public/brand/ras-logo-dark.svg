<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" fill="none">
  <defs>
    <linearGradient id="goldGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="30%" stop-color="#FBBF24"/>
      <stop offset="70%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="crestBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="glowDark" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#F59E0B" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Left Crest Emblem -->
  <g transform="translate(15, 10)">
    <path d="M50 0 C77 0 96 18 96 45 C96 75 50 98 50 98 C50 98 4 75 4 45 C4 18 23 0 50 0 Z" fill="url(#crestBgDark)" stroke="url(#goldGradDark)" stroke-width="2.5" filter="url(#glowDark)"/>
    <path d="M50 6 C72 6 88 22 88 45 C88 70 50 90 50 90 C50 90 12 70 12 45 C12 22 28 6 50 6 Z" fill="none" stroke="url(#goldGradDark)" stroke-width="1" stroke-dasharray="2 3" opacity="0.6"/>

    <!-- Royal Crown -->
    <path d="M37 22 L42 27 L50 17 L58 27 L63 22 L61 31 L39 31 Z" fill="url(#goldGradDark)"/>
    
    <!-- Monogram RAS -->
    <text x="50" y="44" font-family="'Outfit', 'Helvetica', sans-serif" font-weight="900" font-size="16" fill="url(#goldGradDark)" text-anchor="middle" letter-spacing="1.5">RAS</text>

    <!-- Luxury Car Silhouette Inside Crest -->
    <path d="M30 63 C36 57 44 56 50 56 C56 56 64 57 70 63 L73 68 C73 70 71 71 69 71 L31 71 C29 71 27 70 27 68 Z" fill="url(#goldGradDark)"/>
    <circle cx="37" cy="71" r="3.5" fill="#0F172A" stroke="url(#goldGradDark)" stroke-width="1.5"/>
    <circle cx="63" cy="71" r="3.5" fill="#0F172A" stroke="url(#goldGradDark)" stroke-width="1.5"/>
    
    <!-- Laurel Wreath Leaves (Left & Right) -->
    <path d="M22 36 C18 44 20 54 26 62" stroke="url(#goldGradDark)" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M78 36 C82 44 80 54 74 62" stroke="url(#goldGradDark)" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Typography: Brand Name -->
  <g transform="translate(130, 25)">
    <!-- RAS BROTHER -->
    <text x="0" y="38" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="36" fill="#FFFFFF" letter-spacing="2">
      RAS <tspan fill="url(#goldGradDark)">BROTHER</tspan>
    </text>

    <!-- Subtitle: TOUR & TRAVELS -->
    <g transform="translate(2, 62)">
      <!-- Left Star -->
      <polygon points="0,0 2.5,5 8,5.5 4,9.5 5,15 0,12 -5,15 -4,9.5 -8,5.5 -2.5,5" fill="url(#goldGradDark)" transform="scale(0.5) translate(10, -5)"/>
      
      <text x="18" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" fill="#FBBF24" letter-spacing="6">
        TOUR &amp; TRAVELS
      </text>

      <!-- Right Star -->
      <polygon points="0,0 2.5,5 8,5.5 4,9.5 5,15 0,12 -5,15 -4,9.5 -8,5.5 -2.5,5" fill="url(#goldGradDark)" transform="scale(0.5) translate(400, -5)"/>
    </g>

    <!-- Luxury Event Tagline -->
    <text x="2" y="78" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="9" fill="#94A3B8" letter-spacing="1.5">
      PREMIUM CAR RENTAL &amp; EVENT BOOKING MARKETPLACE
    </text>
  </g>
</svg>
