  <path d="M36 61 C40 57 46 56 50 56 C54 56 60 57 64 61 Z" fill="#0A1128"/>
  
  <!-- Wheels -->
  <circle cx="34" cy="71" r="5" fill="#0A1128" stroke="url(#goldGrad)" stroke-width="2"/>
  <circle cx="66" cy="71" r="5" fill="#0A1128" stroke="url(#goldGrad)" stroke-width="2"/>
  
  <!-- RAS Bold Text -->
  <text x="50" y="52" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="14" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1">RAS</text>
