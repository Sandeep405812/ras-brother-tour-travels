      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#E5A93B"/>
      <stop offset="100%" stop-color="#B47414"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1128"/>
      <stop offset="100%" stop-color="#1C2541"/>
    </linearGradient>
  </defs>
  <!-- Background Shield -->
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)"/>
  <rect x="3" y="3" width="94" height="94" rx="21" stroke="url(#goldGrad)" stroke-width="2.5" fill="none"/>
  
  <!-- Crown on Top -->
  <path d="M35 30 L40 37 L50 25 L60 37 L65 30 L63 42 L37 42 Z" fill="url(#goldGrad)"/>
  
  <!-- Stylized Sleek Car Silhouette -->
